name: deploy

# Deploys only once the tests workflow has passed on master, and deploys the
# exact commit that was tested (not whatever master points at by then).
on:
  workflow_run:
    workflows:
      - tests
    types:
      - completed
    branches:
      - master

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/ankiru.org

            TESTED_SHA="${{ github.event.workflow_run.head_sha }}"
            git fetch origin master

            # A slower run of an older push must not roll back a newer deploy.
            if ! git merge-base --is-ancestor HEAD "$TESTED_SHA"; then
              echo "Commit $TESTED_SHA is older than the deployed one, skipping."
              exit 0
            fi

            # Ensure the site is brought back up even if a subsequent step fails
            trap 'php artisan up' EXIT

            php artisan down --retry=10

            git reset --hard "$TESTED_SHA"

            composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            npm ci
            npm run build

            mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true
            chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true

            php artisan migrate --force

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            php artisan queue:restart
            sudo /usr/bin/supervisorctl restart ankiru-worker
            php artisan reverb:restart

            php artisan up
