name: deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/ankiru.org

            git pull origin master

            composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            npm ci
            npm run build

            mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true
            chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true

            php artisan migrate --force

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            php artisan queue:restart
            sudo /usr/bin/supervisorctl restart ankiru-worker
            sudo /usr/bin/supervisorctl restart ankiru-reverb
